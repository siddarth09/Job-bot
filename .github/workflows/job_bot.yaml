name: LinkedIn Jobs → Google Sheets (Daily)

on:
  schedule:
    # 13:00 UTC daily (~6am PT / 9am ET). Hourly scraping gets rate-limited.
    - cron: "0 13 * * *"
  workflow_dispatch:

# Avoid overlapping runs.
concurrency:
  group: job-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write credentials.json from secret
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Run scraper (merges with existing sheet; preserves status/notes)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
        run: |
          python main.py \
            --config profile.yaml \
            --output google \
            --google_sheet_id ${{ secrets.GOOGLE_SHEET_ID }} \
            --google_worksheet Jobs \
            --pause 3
